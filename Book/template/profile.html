{% load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Document</title>
    <div class="profile-container">
    <div class="profile-pic">
    {% if request.user.user_profile.profile_picture %}
      <img src="{{ request.user.user_profile.profile_picture.url }}" alt="">
    {% else %}
        <img  src="/media/default_profile_picture/default-pic.webp"alt="">
    {% endif %}
    <form id="profile-pic-form" action="{% url 'update_profile_pic' %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="profile-pic-input" class="profile-pic-label">
          <!-- <img src="{{ user.user_profile.profile.image.url }}"  class="profile-pic"> -->
          <div class="change-icon">🖉</div>
        </label>
        <input type="file" id="profile-pic-input" name="profile_pic" accept="image/*" style="display: none;" onchange="document.getElementById('profile-pic-form').submit();">
      </form>
      <div class="user-info">
        <h1>{{user_profile.user.username}}</h1>
        <h2>{{user_profile.user.order}}</h2>
        <a id="orders-anchor" href="{% url 'orders'%}" style="color:white">Order</a><br><br>
        <a id="logout-anchor" href="{% url 'logout'%}">Logout</a>

        </div>
    </div>
    </div>
   

</head>
<body>
    
</body>
</html>
